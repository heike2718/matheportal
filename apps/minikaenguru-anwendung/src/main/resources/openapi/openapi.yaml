openapi: '3.0.3'
info:
    title: minikaenguru-anwendung API
    version: 1.0.0
    description: API der minikaenguru-anwendung.
paths:
    /api/berechtigungen:
        get:
            tags:
                - Berechtigungen
            summary: Läd die Minkänguru- Berechtigung eines eingeloggten Users
            description: >
                Holt die UUID aus der Session selektiert mit dieser den Wettbewerbsdurchführenden.
                Falls es einen gibt, wird die Session um eine Berechtigung erweitert und der
                zugehörige User wird zurückgegeben
            operationId: loadBerechtigung
            security:
                - mpSession: []
            responses:
                '200':
                    description: Zuordnung gefunden
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                '401':
                    description: Keine gültige Session vorhanden oder Session ist endgültig abgelaufen
                '404':
                    description: keine Zuordnung gefunden
                '500':
                    description: Serverfehler
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    /api/wettbewerbsdurchfuehrende/konto:
        get:
            tags:
                - Wettbewerbsdurchfuehrender
            summary: 'Lesen eines Wettbewerbsdurchführenden'
            description: 'Ein Wettbewerbsdurchführender mit der uuid aus der session wird gelesen'
            operationId: loadWettbewerbsdurchfuehrenden
            security:
                - mpSession: []
            responses:
                '200':
                    description: Wettbewerbsdurchführender erfolgreich geladen
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Wettbewerbsdurchfuehrender'
                '401':
                    description: keine Session oder Session abgelaufen
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

                '404':
                    description: not found
                '500':
                    description: Serverfehler
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
        post:
            tags:
                - Wettbewerbsdurchfuehrender
            summary: 'Anlegen eines Wettbewerbsdurchführenden'
            description: 'Ein neuer Wettbewerbsdurchführender mit der uuid aus der session wird angelegt'
            operationId: createWettbewerbsdurchfuehrenden
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/WettbewerbsdurchfuehrenderRequest'
            security:
                - mpSession: []
            responses:
                '201':
                    description: Wettbewerbsdurchführender erfolgreich angelegt
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Wettbewerbsdurchfuehrender'
                '400':
                    description: Request ist ungültig
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '401':
                    description: keine Session oder Session abgelaufen
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '409':
                    description: conflict - Es gibt bereits einen Eintrag mit der gegebenen userUuid
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

                '500':
                    description: Serverfehler
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
        put:
            tags:
                - Wettbewerbsdurchfuehrender
            summary: 'Ändern eines Wettbewerbsdurchführenden'
            description: 'Der Wettbewerbsdurchführende mit der uuid aus der session wird geändert'
            operationId: updateWettbewerbsdurchfuehrenden
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/WettbewerbsdurchfuehrenderRequest'
            security:
                - mpSession: []
            responses:
                '201':
                    description: Wettbewerbsdurchführender erfolgreich angelegt
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Wettbewerbsdurchfuehrender'
                '400':
                    description: Request ist ungültig
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '401':
                    description: keine Session oder Session abgelaufen
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

                '500':
                    description: Serverfehler
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    /api/schulkatalog/orte:
        get:
            tags:
                - Schulkatalog
            summary: 'Suche nach Orten im Schulkatalog'
            description: 'Orte des Schulkatalogs, auf die name passt (like)'
            operationId: findOrte
            security:
                - mpSession: []
            parameters:
                - in: query
                  name: name
                  schema:
                      type: string
                      pattern: '^[\p{sc=Latin}\p{M}\p{N}\p{P}\p{S}\p{Zs}]*$'
                  required: true
                  description: Teil eines Ortsnamens
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ArrayOfOrte'
                '400':
                    description: Request ist ungültig
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '401':
                    description: keine Session oder Session abgelaufen
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

                '500':
                    description: Serverfehler
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    /api/schulkatalog/orte/{ortId}/schulen:
        get:
            tags:
                - Schulkatalog
            summary: Laden von Schulen aus dem Schulkatalog
            description: alle Schulen eines Ortes im Schulkatalog werden geladen
            operationId: loadSchulen
            security:
                - mpSession: []
            parameters:
                - in: path
                  name: ortId
                  schema:
                      type: string
                      pattern: '^[A-Z0-9]*$'
                  required: true
                  description: kuerzel des Ortes
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ArrayOfSchulen'
                '400':
                    description: Request ist ungültig
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '401':
                    description: keine Session oder Session abgelaufen
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

                '500':
                    description: Serverfehler
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
components:
    securitySchemes:
        mpSession:
            type: apiKey
            in: cookie
            name: MPSESSIONID
            description: Session-Cookie der Matheportal-Sitzung
    schemas:
        Wettbewerbsdurchfuehrungsart:
            type: string
            enum:
                - SCHULE
                - PRIVAT
            description: die Art, wie der Wettbewerb durchgeführt wird (als Schule oder privat)
            example:
                - SCHULE
                - PRIVAT
        ZugangsberechtigungUnterlagen:
            type: string
            enum:
                - STANDARD
                - ERTEILT
                - ENTZOGEN
            description: Das Herunterladen von Unterlagen kann außerhalb des Zeitfensters freigegeben oder innerhalb des Zeitfensters entzogen werden.
            example:
                - STANDARD
                - ERTEILT
                - ENTZOGEN
        WettbewerbsdurchfuehrenderRequest:
            type: object
            x-class-extra-annotation: '@de.mathejungalt.minikaenguru.anwendung.domain.wettbewerbsdurchfuehrende.ValidWettbewerbsdurchfuehrenderRequest'
            required:
                - typ
            description: Requestobjekt für das Anlegen oder Ändern eines Wettbewerbsdurchführenden.
            properties:
                durchfuehrungsart:
                    type: object
                    $ref: '#/components/schemas/Wettbewerbsdurchfuehrungsart'
                schulkuerzel:
                    type: string
                    pattern: '^[A-Z0-9]*$'
                    maxLength: 8
                    description: Kürzel der Schule. Für die Durchführungsart SCHULE erforderlich.
        Wettbewerbsdurchfuehrender:
            type: object
            description: Responsobjekt für das Anlegen, Ändern und Laden eines bestimmten Wettbewerbsdurchführenden.
            properties:
                durchfuehrungsart:
                    type: object
                    $ref: '#/components/schemas/Wettbewerbsdurchfuehrungsart'
                teilnahmenummern:
                    type: array
                    uniqueItems: true
                    description: Teilnahmenummern sind bei Lehrpersonen die Schulkürzel, bei Privatpersonen ein eindeutiges 10stelliges Kürzel.
                    items:
                        type: string
                        pattern: '^[A-Z0-9]*$'
                    example:
                        - V8DDP4X9ZY
                        - SSBXQUBN
                newsletter:
                    type: boolean
                    description: Flag, ob der Durchführende Newsletter erhalten möchte
                zugangsberechtigungUnterlagen:
                    type: object
                    $ref: '#/components/schemas/ZugangsberechtigungUnterlagen'
        User:
            type: object
            required:
                - fullName
                - berechtigungen
            properties:
                fullName:
                    type: string
                    minLength: 1
                    maxLength: 201
                    pattern: '^[\p{sc=Latin}\p{M}\p{N}\p{P}\p{S}\p{Zs}]*$'
                    description: vollständiger Anzeigename
                    example: María del Carmen 2
                berechtigungen:
                    type: array
                    uniqueItems: true
                    description: Berechtigungen des Benutzers. Diese werden im gegebenen Kontext aus IAM und den 2 Berechtigungstypen Minikänguru gemerged
                    items:
                        type: string
                        pattern: '^[A-Z]+(_[A-Z]+)*$'
                        maxLength: 150
                    example:
                        - STANDARD
                        - ADMIN
                        - SCHULE
                        - PRIVAT
                        - AUTOR
        ConstraintViolationDetail:
            type: object
            properties:
                field:
                    type: string
                    description: Feldname der verletzten Constraint.
                    example: clientId
                message:
                    type: string
                    description: Fehlermeldung zur verletzten Constraint.
                    example: clientId ist ungueltig.
        ErrorResponse:
            type: object
            required:
                - message
            properties:
                message:
                    type: string
                    example: Irgendein Fehler ist aufgetreten
                constraintViolations:
                    type: array
                    items:
                        $ref: '#/components/schemas/ConstraintViolationDetail'
        Land:
            type: object
            properties:
                kuerzel:
                    type: string
                    pattern: '^[A-Z\-]*$'
                    maxLength: 10
                name:
                    type: string
                    pattern: '^[\p{sc=Latin}\p{M}\p{N}\p{P}\p{S}\p{Zs}]*$'
                    maxLength: 100
                anzahlOrte:
                    type: integer
        Ort:
            type: object
            properties:
                land:
                    $ref: '#/components/schemas/Land'
                kuerzel:
                    type: string
                    pattern: '^[A-Z0-9]*$'
                    maxLength: 10
                name:
                    type: string
                    pattern: '^[\p{sc=Latin}\p{M}\p{N}\p{P}\p{S}\p{Zs}]*$'
                    maxLength: 100
                anzahlSchulen:
                    type: integer
        Schule:
            type: object
            properties:
                ort:
                    $ref: '#/components/schemas/Ort'
                kuerzel:
                    type: string
                    pattern: '^[A-Z0-9]*$'
                    maxLength: 8
                name:
                    type: string
                    pattern: '^[\p{sc=Latin}\p{M}\p{N}\p{P}\p{S}\p{Zs}]*$'
                    maxLength: 100
        ArrayOfOrte:
            type: array
            items:
                $ref: '#/components/schemas/Ort'
        ArrayOfSchulen:
            type: array
            items:
                $ref: '#/components/schemas/Schule'
