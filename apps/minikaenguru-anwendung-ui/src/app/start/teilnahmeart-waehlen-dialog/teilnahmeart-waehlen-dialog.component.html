<section class="teilnahmeart-dialog" aria-labelledby="teilnahmeart-dialog-title">
    <header class="teilnahmeart-dialog__header">
        <h2 id="teilnahmeart-dialog-title" class="teilnahmeart-dialog__title">Teilnahmeart auswählen</h2>

        <p class="teilnahmeart-dialog__intro">
            Sie sind angemeldet, haben aber noch kein Minikänguru-Veranstalterkonto. Bitte wählen Sie aus, wie Sie
            Minikänguru nutzen möchten.
        </p>
    </header>

    <div class="teilnahmeart-dialog__options" aria-label="Teilnahmeart">
        <button
            type="button"
            class="teilnahmeart-dialog__option"
            data-testid="mka-teilnahmeart-schule"
            (click)="selectSchule()">
            <span class="teilnahmeart-dialog__option-title">Schule</span>
            <span class="teilnahmeart-dialog__option-text">
                Sie organisieren den Wettbewerb für eine oder mehrere Klassen einer Schule.
            </span>
        </button>

        <button
            type="button"
            class="teilnahmeart-dialog__option"
            data-testid="mka-teilnahmeart-privat"
            (click)="selectPrivat()">
            <span class="teilnahmeart-dialog__option-title">Privat</span>
            <span class="teilnahmeart-dialog__option-text">
                Sie lassen ein oder mehrere Kinder ohne Schule am Wettbewerb teilnehmen.
            </span>
        </button>

        <button
            type="button"
            class="teilnahmeart-dialog__option teilnahmeart-dialog__option--secondary"
            data-testid="mka-teilnahmeart-nicht-teilnehmen"
            (click)="selectNichtTeilnehmen()">
            <span class="teilnahmeart-dialog__option-title">Nicht jetzt</span>
            <span class="teilnahmeart-dialog__option-text"> Es wird kein Veranstalterkonto angelegt. </span>
        </button>
    </div>
</section>
