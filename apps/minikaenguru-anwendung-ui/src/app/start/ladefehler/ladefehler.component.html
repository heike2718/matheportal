<mat-card appearance="outlined" class="ladefehler">
    <mat-card-content>
        <div class="ladefehler__message">
            <mat-icon class="ladefehler__icon" aria-hidden="true">error_outline</mat-icon>

            <div class="ladefehler__text">
                <h2 class="ladefehler__title" data-testid="ladefehler-title">Laden fehlgeschlagen</h2>

                <p data-testid="ladefehler-description">
                    Der Minikänguru-Bereich konnte nicht vollständig geladen werden. Bitte versuchen Sie es später
                    erneut.
                </p>
            </div>
        </div>
    </mat-card-content>
</mat-card>
