<div class="mka-start">
    @if (portalSessionFacade.sessionLoadState() === 'unauthorized') {
        <mka-guest-info></mka-guest-info>
    }
    @if (authorizationFailed()) {
        <p>
            Ihre Minikänguru-Berechtigung konnte nicht geladen werden. Bitte laden Sie die Seite erneut. Sollte der
            Fehler weiterhin auftreten, versuchen Sie es später noch einmal.
        </p>
    }
</div>
