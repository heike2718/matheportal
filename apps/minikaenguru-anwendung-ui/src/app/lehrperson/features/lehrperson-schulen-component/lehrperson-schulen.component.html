<div class="mka-lehrperson-schulen">
    @if (schulenLoaded()) {
        <div class="mka-lehrperson-schulen__results">
            @for (schule of schulen(); track schule.kuerzel) {
                <mka-schule-card [schule]="schule" (schuleSelected)="schuleSelected.emit($event)" />
            }
        </div>
    } @else {
        <p class="mka-lehrperson-schulen__result-count">Lade Schulen ...</p>
    }
</div>
