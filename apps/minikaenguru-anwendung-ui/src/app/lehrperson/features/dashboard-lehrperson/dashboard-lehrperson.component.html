<div class="lehrperson-dashboard">
    <h2 class="lehrperson-dashboard__title">Minikänguru an Ihrer Schule</h2>

    <p data-testid="lehrperson-dashboard-general-hint" class="lehrperson-dashboard__hint">
        Hier organisieren Sie die Teilnahme Ihrer Schule am Minikänguru-Wettbewerb.
    </p>

    @if (isSchulenLoaded()) {
        <h3 class="lehrperson-dashboard__schulenlist-header">Mit welcher Schule möchten Sie arbeiten?</h3>

        <p data-testid="lehrperson-dashboard-schulenlist-hint" class="lehrperson-dashboard__hint">
            Wählen Sie eine Schule aus, um deren Übersicht zu öffnen.
        </p>

        <mka-lehrperson-schulen
            [schulen]="schulen()"
            [schulenLoaded]="isSchulenLoaded()"
            (schuleSelected)="onSchuleSelected($event)" />
    }
</div>
