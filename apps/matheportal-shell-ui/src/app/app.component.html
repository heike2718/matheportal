<mat-sidenav-container>
    <mat-sidenav #sidenav mode="push" [opened]="false" role="navigation">
        <portal-sidenav (sidenavClose)="sidenav.close()"></portal-sidenav>
    </mat-sidenav>
    <mat-sidenav-content>
        <portal-navbar #navbar (sidenavToggle)="sidenav.toggle()"></portal-navbar>
        <main>
            <mp-message />
            <mp-loading-indicator />
            <router-outlet />
        </main>
    </mat-sidenav-content>
</mat-sidenav-container>
