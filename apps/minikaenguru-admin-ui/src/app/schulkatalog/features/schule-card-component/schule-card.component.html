<button type="button" class="mk-admin-schule-card" (click)="schuleSelected.emit(schule())">
    <span class="mk-admin-schule-card__content">
        <span class="mk-admin-schule-card__name"> {{ schule().name }} ({{ schule().kuerzel }}) </span>

        <span class="mk-admin-schule-card__ort"> {{ schule().ort.name }} ({{ schule().ort.land.kuerzel }}) </span>
    </span>

    <span class="mk-admin-schule-card__arrow" aria-hidden="true"> › </span>
</button>
