<div class="mk-admin-schulkatalog">
    @if (isSchulenLoaded()) {
        <mk-admin-schulen-list
            [selectedOrt]="beschreibungSelectedOrt()"
            [schulen]="schulen()"
            [schulenLoaded]="isSchulenLoaded()"
            (backToOrteRequested)="onBackToOrteRequested()"
            (schuleAnlegenRequested)="onSchuleAnlegenRequested()"
            (schuleUmbenennenSelected)="onSchuleUmbenennenSelected($event)" />
    } @else {
        @if (isOrteLoaded()) {
            <mk-admin-orte-list
                [selectedLand]="nameSelectedLand()"
                [orte]="orte()"
                [orteLoaded]="isOrteLoaded()"
                (backToLaenderRequested)="onBackToLaenderRequested()"
                (ortMitSchuleAnlegenRequested)="onOrtMitSchuleAnlegenRequested()"
                (ortSelected)="onOrtSelected($event)" />
        } @else {
            <mk-admin-laender-list
                [laender]="laender()"
                [laenderLoaded]="isLaenderLoaded()"
                (landSelected)="onLandSelected($event)"
                (landMitOrtUndSchuleAnlegenRequested)="onLandMitOrtUndSchuleAnlegenRequested()" />
        }
    }
</div>
