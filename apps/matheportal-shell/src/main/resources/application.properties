quarkus.http.port=9100
quarkus.http.test-port=9100

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://mathe-jung-alt.de
quarkus.http.cors.access-control-allow-credentials=true

# --------------------------------------------------------------------------------
#          Session
# --------------------------------------------------------------------------------
session.idle.timeout=60
session.max.lifetime=1440

session.cookie.name=MPSESSIONID
session.cookie.path=/matheportal
session.cookie.secure=true

# --------------------------------------------------------------------------------
#          Serialization
# --------------------------------------------------------------------------------
# see https://quarkus.io/guides/rest#accessing-request-parameters
quarkus.rest.jackson.optimization.enable-reflection-free-serializers=true.

# --------------------------------------------------------------------------------
#           Authentifizierung
# --------------------------------------------------------------------------------
auth-app.url=https://mathe-jung-alt.de/authprovider/
client.redirect.url=https://mathe-jung-alt.de/matheportal/

# Issuer-Prüfung (entspricht withIssuer(...))
mp.jwt.verify.issuer=heike2718/authprovider

mp.jwt.verify.publickey.location=keys/authprov_public_key.pem

# Optional: etwas Toleranz bei Uhrzeiten (Sekunden)
smallrye.jwt.verify.clock.skew=5

# --------------------------------------------------------------------------------
#           REST-Clients
# --------------------------------------------------------------------------------
## authprovider
quarkus.rest-client.authprovider.url=https://mathe-jung-alt.de/authprovider
quarkus.rest-client.authprovider.scope=ApplicationScoped
quarkus.rest-client.authprovider.connect-timeout=5000
quarkus.rest-client.authprovider.read-timeout=30000

# diagnose bei Fehlern - mal ins payload schauen
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=5000
quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=ERROR

# --------------------------------------------------------------------------------
#           CDI
# --------------------------------------------------------------------------------
quarkus.index-dependency.authsessions.group-id=de.mathejungalt
quarkus.index-dependency.authsessions.artifact-id=authsessions


# --------------------------------------------------------------------------------
#           database
# --------------------------------------------------------------------------------
quarkus.datasource.sessions.db-kind=mariadb
quarkus.datasource.sessions.jdbc.url=jdbc:mariadb://matheportal-sessions-db:3306/matheportal_sessions
quarkus.datasource.sessions.username=matheportal_sessions

quarkus.hibernate-orm.sessions.datasource=sessions
quarkus.hibernate-orm.sessions.database.generation=none
quarkus.hibernate-orm.sessions.packages=de.mathejungalt.authsessions.internal.session.entities

# Flyway Configuration
quarkus.flyway.sessions.connect-retries=2
quarkus.flyway.sessions.create-schemas=false
quarkus.flyway.sessions.default-schema=matheportal_sessions
quarkus.flyway.sessions.table=schema_version
quarkus.flyway.sessions.migrate-at-start=true
quarkus.flyway.sessions.clean-disabled=true
quarkus.flyway.sessions.validate-migration-naming=true
